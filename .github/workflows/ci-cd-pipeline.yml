name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - qa
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"

permissions:
  contents: write

jobs:
  # ============================================================================
  # STAGE 1: Detección de cambios
  # ============================================================================
  changes:
    name: "Stage 1: Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      scripts: ${{ steps.filter.outputs.scripts }}
      overrides: ${{ steps.filter.outputs.overrides }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'tests/**/*.cpp'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'vcpkg.json'
            scripts:
              - 'data/**/*.lua'
              - 'data/**/*.xml'
              - 'data-canary/**/*.lua'
              - 'data-canary/**/*.xml'
              - 'data-otservbr-global/**'
            overrides:
              - 'overrides/**'

      - name: Debug - Show detected changes
        run: |
          echo "cpp: ${{ steps.filter.outputs.cpp }}"
          echo "scripts: ${{ steps.filter.outputs.scripts }}"
          echo "overrides: ${{ steps.filter.outputs.overrides }}"

  # ============================================================================
  # STAGE 2: Build on VPS (ONLY develop + ONLY if C++ changed)
  # Produces immutable release tag: build-${sha}
  # ============================================================================
  build-vps:
    name: "Stage 2: Build on VPS (develop, C++ only)"
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, olmera-vps]
    outputs:
      build_tag: ${{ steps.meta.outputs.build_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Aquí asumo que en tu VPS ya tienes deps (gcc/cmake/ninja/vcpkg/ccache, etc.)
      # Si NO, entonces instalas deps en el runner (o usas un script bootstrap).
      - name: Build (linux-release)
        shell: bash
        run: |
          set -euo pipefail

          # Build (misma lógica que ya traías)
          cmake --preset linux-release -DTOGGLE_BIN_FOLDER=ON
          cmake --build --preset linux-release

          # Tests (opcional: si quieres correrlos en VPS)
          ctest --test-dir build/linux-release -V -R unit || true
          ctest --test-dir build/linux-release -V -R integration || true

          # Package
          mkdir -p dist
          mv build/linux-release/bin/canary dist/olmeraot
          (cd dist && zip -r olmeraot-linux-x86_64.zip olmeraot)
          sha256sum dist/olmeraot-linux-x86_64.zip > dist/SHA256SUMS
          ls -lh dist

      - name: Set build tag
        id: meta
        run: |
          echo "build_tag=build-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Publish build artifact as Release (immutable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.build_tag }}
          name: Build ${{ github.sha }}
          body: |
            ✅ Build generado en VPS (self-hosted runner)

            Branch: develop
            Commit: ${{ github.sha }}
            C++ changed: ${{ needs.changes.outputs.cpp }}

            Este artefacto se promueve a QA/PROD descargando build-${{ github.sha }}.
          draft: false
          prerelease: true
          files: |
            dist/olmeraot-linux-x86_64.zip
            dist/SHA256SUMS

  # ============================================================================
  # STAGE 3A: QA - Scripts/Overrides only (no build)
  # ============================================================================
  sync-scripts-qa:
    name: "Stage 3A: Sync Scripts to QA (no binary)"
    needs: changes
    if: |
      github.ref == 'refs/heads/qa' &&
      (needs.changes.outputs.scripts == 'true' || needs.changes.outputs.overrides == 'true') &&
      needs.changes.outputs.cpp != 'true'
    runs-on: ubuntu-latest
    env:
      QA_DEPLOY_ENABLED: ${{ vars.QA_DEPLOY_ENABLED || secrets.QA_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Prepare SSH known_hosts (QA)
        if: env.QA_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload scripts to QA (tar + SSH)
        if: env.QA_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail

          tar czf /tmp/scripts.tar.gz \
            --transform 's,^,current/,' \
            data data-canary data-otservbr-global overrides key.pem

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/scripts.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.VPS_QA_PATH }} && \
             rm -rf current/data current/data-canary current/data-otservbr-global current/overrides && \
             tar xzf /tmp/scripts.tar.gz && rm /tmp/scripts.tar.gz"

          rm -f ~/.ssh/deploy_key /tmp/scripts.tar.gz

      - name: Apply overrides + render config + reload QA (HUP)
        if: env.QA_DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEST="${{ secrets.VPS_QA_PATH }}"
            cd "$DEST"

            # Overlay mechanism + render config
            sudo /usr/local/bin/olmera-apply-overrides qa || true
            sudo /usr/local/bin/olmera-render-config qa

            # Hot reload scripts
            sudo systemctl kill -s HUP olmeraot-qa.service || sudo systemctl restart olmeraot-qa.service
            sudo systemctl status olmeraot-qa --no-pager || true

  # ============================================================================
  # STAGE 3B: QA - Deploy binary (NO BUILD HERE). Downloads build-${sha}.
  # Runs when C++ changed on this commit in qa branch.
  # ============================================================================
  deploy-qa:
    name: "Stage 3B: Deploy to QA (binary + scripts)"
    needs: changes
    if: github.ref == 'refs/heads/qa' && needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    env:
      QA_DEPLOY_ENABLED: ${{ vars.QA_DEPLOY_ENABLED || secrets.QA_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload scripts to QA (tar + SSH)
        if: env.QA_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail

          tar czf /tmp/scripts.tar.gz \
            --transform 's,^,current/,' \
            data data-canary data-otservbr-global overrides key.pem

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/scripts.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.VPS_QA_PATH }} && \
             rm -rf current/data current/data-canary current/data-otservbr-global current/overrides && \
             tar xzf /tmp/scripts.tar.gz && rm /tmp/scripts.tar.gz"

          rm -f ~/.ssh/deploy_key /tmp/scripts.tar.gz

      - name: Deploy binary + apply overrides + restart QA
        if: env.QA_DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEST="${{ secrets.VPS_QA_PATH }}"
            DEST=${DEST:-/opt/olmeraot/qa}
            cd "$DEST"

            TAG="build-${{ github.sha }}"

            # Download immutable build artifact generated in develop
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o /tmp/olmeraot.zip \
              "https://github.com/${{ github.repository }}/releases/download/${TAG}/olmeraot-linux-x86_64.zip"

            unzip -o /tmp/olmeraot.zip -d "$DEST"
            chmod +x "$DEST/olmeraot"
            rm -f /tmp/olmeraot.zip

            # Apply overrides + render config
            sudo /usr/local/bin/olmera-apply-overrides qa || true
            sudo /usr/local/bin/olmera-render-config qa

            # Ensure key.pem in current/
            if [ -f key.pem ] && [ ! -f current/key.pem ]; then
              cp -f key.pem current/key.pem
            fi
            chmod 640 current/key.pem || true

            sudo systemctl restart olmeraot-qa.service || true
            sleep 2
            sudo systemctl status olmeraot-qa --no-pager || true

  # ============================================================================
  # STAGE 4: Production - Scripts only (main)
  # ============================================================================
  deploy-scripts-prod:
    name: "Stage 4A: Deploy Scripts to Production (main, no binary)"
    needs: changes
    if: |
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.scripts == 'true' || needs.changes.outputs.overrides == 'true') &&
      needs.changes.outputs.cpp != 'true' &&
      vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-server
      url: https://olmeraot.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload scripts to Production (tar + SSH)
        run: |
          set -euo pipefail

          tar czf /tmp/scripts.tar.gz \
            --transform 's,^,current/,' \
            data data-canary data-otservbr-global overrides key.pem

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/scripts.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.VPS_PROD_PATH }} && \
             rm -rf current/data current/data-canary current/data-otservbr-global current/overrides && \
             tar xzf /tmp/scripts.tar.gz && rm /tmp/scripts.tar.gz"

          rm -f ~/.ssh/deploy_key /tmp/scripts.tar.gz

      - name: Apply overrides + render config + reload PROD (HUP)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEST="${{ secrets.VPS_PROD_PATH }}"
            DEST=${DEST:-/opt/olmeraot/prod}
            cd "$DEST"

            sudo /usr/local/bin/olmera-apply-overrides prod || true
            sudo /usr/local/bin/olmera-render-config prod

            sudo systemctl kill -s HUP olmeraot-prod.service || sudo systemctl restart olmeraot-prod.service
            sudo systemctl status olmeraot-prod --no-pager || true

  # ============================================================================
  # STAGE 4B: Production - Deploy binary from build-${sha} (main)
  # ============================================================================
  promote-production:
    name: "Stage 4B: Deploy to Production (binary + scripts)"
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.cpp == 'true' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-server
      url: https://olmeraot.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Upload scripts to Production (tar + SSH)
        run: |
          set -euo pipefail

          tar czf /tmp/scripts.tar.gz \
            --transform 's,^,current/,' \
            data data-canary data-otservbr-global overrides key.pem

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/scripts.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/

          rm -f ~/.ssh/deploy_key /tmp/scripts.tar.gz

      - name: Deploy binary + extract scripts + apply overrides + restart PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            DEST="${{ secrets.VPS_PROD_PATH }}"
            DEST=${DEST:-/opt/olmeraot/prod}
            cd "$DEST"

            # Extract scripts
            rm -rf current/data current/data-canary current/data-otservbr-global current/overrides
            tar xzf /tmp/scripts.tar.gz
            rm -f /tmp/scripts.tar.gz

            TAG="build-${{ github.sha }}"

            # Backup current binary
            if [ -f olmeraot ]; then
              cp olmeraot "olmeraot.backup.$(date +%Y%m%d_%H%M%S)"
            fi

            # Download immutable build artifact
            curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o /tmp/olmeraot.zip \
              "https://github.com/${{ github.repository }}/releases/download/${TAG}/olmeraot-linux-x86_64.zip"

            unzip -o /tmp/olmeraot.zip -d "$DEST"
            chmod +x "$DEST/olmeraot"
            rm -f /tmp/olmeraot.zip

            sudo /usr/local/bin/olmera-apply-overrides prod || true
            sudo /usr/local/bin/olmera-render-config prod

            # Ensure key.pem in current/
            if [ -f key.pem ] && [ ! -f current/key.pem ]; then
              cp -f key.pem current/key.pem
            fi
            chmod 640 current/key.pem || true

            sudo systemctl restart olmeraot-prod.service || true
            sleep 2
            sudo systemctl status olmeraot-prod --no-pager || true